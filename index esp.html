<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Español Lab</title><style> *{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#203044;font:17px system-ui}header{background:#173b50;color:white;padding:25px}main{max-width:950px;margin:auto;padding:18px}section,article{background:white;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #0001}button,select,input{font:inherit;padding:10px;border:1px solid #bbc6cc;border-radius:8px}button{background:#176b70;color:white;cursor:pointer}button.secondary{background:white;color:#176b70}nav, .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}strong{color:#a52650}header strong{color:#ffd27b}label.option{display:block;padding:8px} .ok{color:#167047}.bad{color:#b32635} .feedback{margin-top:10px}input[type=text]{width:100%;max-width:480px} .keys button{padding:5px 10px;margin:3px;background:#edf3f4;color:#173b50} [hidden]{display:none!important} h2{margin-top:0}small{color:#536575}</style><header><h1>Español Lab <strong>· El imperativo</strong></h1>Studia, esercitati e verifica i tuoi progressi</header><main><nav><button onclick="show('theory')">📖 Teoria</button><button onclick="show('practice')">✏️ Esercitazione</button></nav><div id="theory"></div><div id="practice" hidden><section><h2>Genera esercizi</h2><div class="controls"><label>Argomento <select id="topic"></select></label><label>Numero <select id="count"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select></label><label>Livello <select id="level"><option value="1">Facile</option><option value="2" selected>Medio</option><option value="3">Difficile</option></select></label><label>Modalità <select id="mode"><option value="mix">Mista</option><option value="choice">Risposta multipla</option><option value="open">Risposta aperta</option></select></label><button onclick="generate()">Nuovo test</button></div><p><small>Gli accenti sono obbligatori. Le maiuscole non influiscono sul risultato.</small></p></section><div id="quiz"></div><div id="actions" hidden><button onclick="check()">Controlla risposte</button> <button class="secondary" onclick="retry()">Ripeti errori</button><section id="result" aria-live="polite"></section></div></div></main><script>
const groups=['Verbi regolari','Verbos bota','Verbi irregolari','Un pronome','Due pronomi','Preguntar / pedir','Articolo neutro lo'];
const verbs=[['hablar','habla','hablad',0],['comer','come','comed',0],['escribir','escribe','escribid',0],['escuchar','escucha','escuchad',0],['beber','bebe','bebed',0],['correr','corre','corred',0],['explicar','explica','explicad',0],['mirar','mira','mirad',0],['presentar','presenta','presentad',0],['leer','lee','leed',0],['tomar','toma','tomad',0],['abrir','abre','abrid',0],['subir','sube','subid',0],['llamar','llama','llamad',0],['saludar','saluda','saludad',0],['empezar','empieza','empezad',1],['volver','vuelve','volved',1],['pedir','pide','pedid',1],['seguir','sigue','seguid',1],['dormir','duerme','dormid',1],['jugar','juega','jugad',1],['servir','sirve','servid',1],['mover','mueve','moved',1],['probar','prueba','probad',1],['cerrar','cierra','cerrad',1],['contar','cuenta','contad',1],['repetir','repite','repetid',1],['ir','ve','id',2],['hacer','haz','haced',2],['tener','ten','tened',2],['ser','sé','sed',2],['venir','ven','venid',2],['decir','di','decid',2],['poner','pon','poned',2],['salir','sal','salid',2]];
const rules=['Tú: terza persona singolare del presente. Vosotros: sostituisci la -r finale con -d.','Tú mantiene il cambio vocalico del presente (e→ie, o→ue, e→i; jugar: u→ue). Vosotros non cambia la vocale.','Memorizza le otto forme irregolari di tú. Vosotros segue la regola della -d.','Il pronome si unisce alla fine del verbo. Usa lo, la, los, las secondo genere e numero. Mantieni la posizione dell’accento tonico.','Ordine: verbo + complemento indiretto + complemento diretto. Le e les diventano se davanti a lo, la, los, las.','Preguntar: chiedere informazioni. Pedir: chiedere qualcosa a qualcuno.','Lo è invariabile e si usa con aggettivi, avverbi o que.'];
const examples=[[],[],[],['Haz el ejercicio → Hazlo','Toma una pastilla → Tómala','Mueve los brazos → Muévelos','Levanta las piernas → Levántalas'],['Explica el ejercicio a mí → Explícamelo','Regala los libros a Juan → Regálaselos','Da las llaves a nosotros → Dánoslas'],['Pregúntale cómo se llama.','Pídele ayuda al profesor.'],['Ella dice lo que piensa.','Lo mejor es ir a nadar.','No sabes lo bien que canta.']];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('theory').innerHTML=groups.map((g,i)=>`<section><h2>${i+1}. ${g}</h2><p>${rules[i]}</p>${i<3?'<table><tr><th>Infinito</th><th>Tú</th><th>Vosotros</th></tr>'+verbs.filter(v=>v[3]===i).map(v=>`<tr><td>${v[0]}</td><td><strong>${v[1]}</strong></td><td>${v[2]}</td></tr>`).join('')+'</table>':examples[i].map(e=>`<p>${e}</p>`).join('')}${i===4?'<p>CI: me, te, le/les → se, nos, os. CD: lo, la, los, las.</p>':''}${i===2?'<p>Oír → oye; construir → construye: mantengono la modifica del presente.</p>':''}</section>`).join('');
const $=id=>document.getElementById(id);$('topic').innerHTML='<option value="all">Tutti gli argomenti</option>'+groups.map((g,i)=>`<option value="${i}">${g}</option>`).join('');function show(id){$('theory').hidden=id!=='theory';$('practice').hidden=id!=='practice';if(id==='practice'&&!current.length)generate()}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const nouns=[['el libro','lo'],['la carta','la'],['los libros','los'],['las cartas','las'],['el ejercicio','lo'],['la respuesta','la'],['los apuntes','los'],['las llaves','las']];
const pv=[['explica','explíca',[4,5]],['regala','regála',[0,1,2,3,6,7]],['presta','présta',[0,2,6,7]],['entrega','entréga',[0,1,2,3,6,7]],['da','dá',[0,1,2,3,5,6,7]],['lee','lée',[0,1,2,3,5,6]]];
const recipients=[['a Juan','se'],['a Diana','se'],['a tus amigos','se'],['a mí','me'],['a nosotros','nos']];
function bank(){let b=[];function add(g,q,a,d,hard=1){b.push({g,q,a,d:[...new Set(d.filter(x=>x!==a))],hard})}for(let v of verbs){for(let p of [1,2]){let person=p===1?'tú':'vosotros',a=v[p],d=[v[3]===2?v[0].slice(0,-1):v[0],v[3]===1?v[0].slice(0,-2)+(v[0].endsWith('ar')?'a':'e'):v[1]+'s',v[3]===1?v[1]+'d':v[2],v[1],v[0].slice(0,-1)+'d',a+'s'];add(v[3],`${v[0]} (${person}): scrivi l’imperativo.`,a,d);add(v[3],`¿${p===1?'Puedo':'Podemos'} ${v[0]}? — Sí, …`,a,d,2);add(v[3],`Correggi la forma «${p===1?v[2]:v[1]}» per ${person} (${v[0]}).`,a,d,3)}}for(let [v,accent,ids] of pv)for(let i of ids){let [n,pr]=nouns[i];let base=v==='da'?'da':accent;let a=base+pr;add(3,`${v[0].toUpperCase()+v.slice(1)} ${n}. Sostituisci il complemento diretto.`,a,[v+pr,base+(pr==='lo'?'la':'lo'),pr+' '+v],1);for(let [r,ci] of recipients){let ans=accent+ci+pr;add(4,`${v[0].toUpperCase()+v.slice(1)} ${n} ${r}. Usa due pronomi.`,ans,[v+ci+pr,accent+pr+ci,accent+'le'+pr,accent+ci+(pr==='lo'?'la':'lo')],2)}}
for(let [q,a] of [['… ayuda al profesor.','Pide'],['… cómo se llama.','Pregunta'],['… un vaso de agua.','Pide'],['… dónde está el museo.','Pregunta'],['… la hora.','Pregunta'],['… permiso para salir.','Pide'],['… información sobre el horario.','Pide'],['… cuánto cuesta.','Pregunta'],['… un libro prestado.','Pide'],['… cuándo empieza la clase.','Pregunta']])add(5,q,a,['Pide','Pregunta'],1);
for(let q of ['… mejor es ir a nadar.','Ella dice … que piensa.','No sabes … bien que canta.','… importante es estudiar.','… difícil es empezar.','Me gusta … que dices.','Mira … que hace.','… bueno es descansar.','No imaginas … rápido que corre.','… peor es llegar tarde.'])add(6,q,'lo',['el','la','los'],1);return b}
let current=[],wrong=[],active=null;function generate(){let all=bank(),t=$('topic').value,l=+$('level').value,n=+$('count').value;let pool=all.filter(q=>(t==='all'||q.g===+t)&&q.hard<=l);if(!pool.length)pool=all.filter(q=>q.g===+t);let preferred=shuffle(pool.filter(q=>q.hard===l));let rest=shuffle(pool.filter(q=>q.hard!==l));let selected=[];if(t==='all'){let buckets=groups.map((_,i)=>shuffle(pool.filter(q=>q.g===i)));while(selected.length<n&&buckets.some(b=>b.length)){for(let b of shuffle(buckets))if(b.length&&selected.length<n)selected.push(b.pop())}}else selected=[...preferred,...rest].slice(0,n);current=shuffle(selected).map((q,i)=>({...q,open:$('mode').value==='open'||($('mode').value==='mix'&&(l===3?i%3!==0:i%2===1)),options:shuffle([q.a,...shuffle(q.d).slice(0,3)])}));render();if(current.length<n)$('result').textContent=`Disponibili ${current.length} quesiti distinti per questa selezione.`}
function render(){wrong=[];active=null;$('quiz').innerHTML=current.map((q,i)=>`<article><small>${groups[q.g]}</small><p><b>${i+1}. ${esc(q.q)}</b></p>${q.open?`<input type="text" id="a${i}" autocomplete="off" autocapitalize="off" spellcheck="false" onfocus="active=this" placeholder="Scrivi la risposta"><div class="keys">${[...'áéíóúñü¿¡'].map(k=>`<button type="button" onmousedown="event.preventDefault()" onclick="insert('${k}',${i})">${k}</button>`).join('')}</div>`:q.options.map(o=>`<label class="option"><input type="radio" name="a${i}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}<div class="feedback" id="f${i}"></div></article>`).join('');$('actions').hidden=false;$('result').textContent='Completa gli esercizi e premi Controlla risposte.'}
function insert(k,i){let e=$('a'+i);let s=e.selectionStart??e.value.length;e.setRangeText(k,s,e.selectionEnd??s,'end');e.focus()}
const norm=s=>s.trim().toLowerCase().normalize('NFC').replace(/[.!¡¿?]+$/,'');function check(){wrong=[];let score=0;current.forEach((q,i)=>{let val=q.open?$('a'+i).value:document.querySelector(`input[name=a${i}]:checked`)?.value||'';let ok=norm(val)===norm(q.a);if(ok)score++;else wrong.push(q);$('f'+i).innerHTML=`<b class="${ok?'ok':'bad'}">${ok?'✓ Corretto':val?'✗ Risposta corretta: '+esc(q.a):'Non risposto — '+esc(q.a)}</b><p>${rules[q.g]}</p>`});$('result').innerHTML=`<h2>Risultato: ${score}/${current.length}</h2><p>Voto: ${(score/current.length*10).toFixed(1).replace('.',',')}/10</p>`}function retry(){if(!wrong.length){$('result').textContent='Nessun errore da ripetere: controlla prima le risposte.';return}current=wrong.map(q=>({...q,options:shuffle(q.options)}));render();$('quiz').scrollIntoView({behavior:'smooth'})}
</script></html>
